    { name = "paulsimion16", email = "paul.simion.sorin@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "pandas>=2.3.3",
    "psycopg[binary]>=3.3.6",
